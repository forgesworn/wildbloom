name: Bug report
description: Report a reproducible Wildbloom defect without sharing sensitive material.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Do not paste a private key, recovery key, unpublished event, private file, or live credential here.  Use private vulnerability reporting for security-sensitive defects.
  - type: input
    id: version
    attributes:
      label: Version
      description: Full Git commit, hosted URL, or release version.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, browser and versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Minimal steps using disposable data and services.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: safe
    attributes:
      label: Public-data check
      options:
        - label: I have removed keys, credentials, private file contents, private endpoints and personal data.
          required: true
