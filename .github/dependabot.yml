version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      # First match wins. @vitest/* peer-depend on the exact vitest version, so
      # the ungrouped major path raises one PR per package and neither can
      # install: npm ci dies on ERESOLVE with vitest@4 pinned against
      # @vitest/coverage-v8@5. Move the family together.
      vitest:
        patterns: ["vitest", "@vitest/*"]
        update-types:
          - major
          - minor
          - patch
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Runtime and type majors move together only after the complete platform
      # matrix has been deliberately retargeted from Node 24.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
