name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
      - name: Record exact production build evidence
        run: npm run release:evidence -- --require-clean --output build-evidence-${{ runner.os }}.json
      - name: Upload exact production build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence-${{ runner.os }}
          path: build-evidence-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

  reproducible-build:
    name: exact build equality (Windows, Linux and macOS)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Download Linux build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-evidence-Linux
          path: .artifacts/build-evidence/Linux
      - name: Download Windows build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-evidence-Windows
          path: .artifacts/build-evidence/Windows
      - name: Download macOS build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-evidence-macOS
          path: .artifacts/build-evidence/macOS
      - name: Require byte-for-byte build equality
        run: >-
          node scripts/compare-build-evidence.mjs
          --expect-commit ${{ github.sha }}
          --input linux=.artifacts/build-evidence/Linux/build-evidence-Linux.json
          --input windows=.artifacts/build-evidence/Windows/build-evidence-Windows.json
          --input macos=.artifacts/build-evidence/macOS/build-evidence-macOS.json

  browser-engine:
    name: browser (${{ matrix.browser }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            os: ubuntu-latest
          - browser: webkit
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm exec --offline -- playwright-core install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npm run smoke:browser:${{ matrix.browser }}

  peer-swarm:
    name: browser (two-peer swarm on ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm exec --offline -- playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run smoke:swarm -- --browser chromium

  branded-firefox:
    name: browser (branded Firefox on ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: firefox --version
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run acceptance:firefox
