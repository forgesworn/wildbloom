name: Pool storage acceptance

on:
  pull_request:
  workflow_dispatch:
    inputs:
      node_commit:
        description: Full reviewed wildbloom-node commit SHA containing pool-repair
        required: false
        default: "39e46f4d5802d8660ce1617956cf5ae9b6200e11"
        type: string
      maximum:
        description: Also exercise the 256 MiB source limit in Chromium
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pool:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: macos-latest
            browser: webkit
          - os: windows-latest
            browser: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require an immutable daemon revision
        env:
          NODE_COMMIT: ${{ inputs.node_commit || '39e46f4d5802d8660ce1617956cf5ae9b6200e11' }}
        shell: bash
        run: '[[ "$NODE_COMMIT" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: forgesworn/wildbloom-node
          ref: ${{ inputs.node_commit || '39e46f4d5802d8660ce1617956cf5ae9b6200e11' }}
          path: .artifacts/wildbloom-node
      - run: rustup toolchain install 1.94.1 --profile minimal
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm exec --offline -- playwright-core install --with-deps ${{ matrix.browser }}
      - run: cargo +1.94.1 build --locked --manifest-path .artifacts/wildbloom-node/Cargo.toml -p wildbloomd
      - run: npm run build
      - name: Quick node-loss and automatic repair check
        shell: bash
        env:
          WILDBLOOM_BROWSER: ${{ matrix.browser }}
          WILDBLOOM_POOL_EVIDENCE: quick-pool-recovery.json
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          export WILDBLOOM_NODE_BIN="$GITHUB_WORKSPACE/.artifacts/wildbloom-node/target/debug/wildbloomd$suffix"
          npm run acceptance:pool:quick
      - name: Save quick recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quick-pool-recovery-${{ matrix.os }}-${{ matrix.browser }}
          path: quick-pool-recovery.json
          if-no-files-found: warn
      - name: Browser and unattended native repair acceptance
        shell: bash
        env:
          WILDBLOOM_BROWSER: ${{ matrix.browser }}
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          export WILDBLOOM_NODE_BIN="$GITHUB_WORKSPACE/.artifacts/wildbloom-node/target/debug/wildbloomd$suffix"
          npm run acceptance:pool
      - name: Maximum file pool acceptance
        if: inputs.maximum && matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium'
        shell: bash
        env:
          WILDBLOOM_BROWSER: chromium
        run: |
          export WILDBLOOM_NODE_BIN="$GITHUB_WORKSPACE/.artifacts/wildbloom-node/target/debug/wildbloomd"
          npm run acceptance:pool -- --maximum
