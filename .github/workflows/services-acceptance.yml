name: Node services acceptance

on:
  workflow_dispatch:
    inputs:
      node_commit:
        description: Full reviewed wildbloom-node commit containing checkout and storage proofs
        required: true
        type: string

permissions:
  contents: read

jobs:
  services:
    name: Synthetic payments, discovery and full-read audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate the explicit Node revision
        env:
          NODE_COMMIT: ${{ inputs.node_commit }}
        run: |
          [[ "$NODE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: forgesworn/wildbloom-node
          ref: ${{ inputs.node_commit }}
          path: .artifacts/services-node
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - run: cargo build --locked --manifest-path .artifacts/services-node/Cargo.toml -p wildbloomd -p wildbloom-checkout --bin wildbloomd --example checkout_fixture
      - run: npm run build
      - name: Exercise the real daemon through the production browser
        run: |
          export WILDBLOOM_NODE_BIN="$GITHUB_WORKSPACE/.artifacts/services-node/target/debug/wildbloomd"
          export WILDBLOOM_CHECKOUT_FIXTURE="$GITHUB_WORKSPACE/.artifacts/services-node/target/debug/examples/checkout_fixture"
          npm run acceptance:services
