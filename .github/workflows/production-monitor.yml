name: Verify production deployment

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ vars.WILDBLOOM_PRODUCTION_ORIGIN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The live origin should serve whatever the last successful production
      # deployment shipped. A dashboard rollback or a half-finished deploy
      # therefore fails this check until main is deployed again.
      - name: Find the last successfully deployed commit
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cloudflare-production.yml \
            --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
          if [ -z "$commit" ]; then
            echo "No successful production deployment is recorded." >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.production.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require the recorded production source and custom origin
        env:
          PRODUCTION_SOURCE_COMMIT: ${{ steps.production.outputs.commit }}
          PRODUCTION_ORIGIN: ${{ vars.WILDBLOOM_PRODUCTION_ORIGIN }}
        run: >-
          node scripts/assert-production-context.mjs
          --source-commit "$PRODUCTION_SOURCE_COMMIT"
          --workflow-ref "$GITHUB_REF"
          --origin "$PRODUCTION_ORIGIN"
      - run: npm run install:policy
      - run: npm run build
      - name: Recreate exact release evidence
        run: npm run release:evidence -- --require-clean --output "$RUNNER_TEMP/release-evidence.json"
      - name: Verify live bytes and edge policy
        env:
          PRODUCTION_ORIGIN: ${{ vars.WILDBLOOM_PRODUCTION_ORIGIN }}
        run: >-
          npm run verify:deployment --
          --origin "$PRODUCTION_ORIGIN"
          --evidence "$RUNNER_TEMP/release-evidence.json"
