name: Deploy Cloudflare production

# Every push to main is the reviewed source: it runs the full release gate,
# deploys and verifies the live origin. Run it by hand to redeploy main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: production
      url: ${{ vars.WILDBLOOM_PRODUCTION_ORIGIN }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require the main source and custom production origin
        env:
          PRODUCTION_ORIGIN: ${{ vars.WILDBLOOM_PRODUCTION_ORIGIN }}
        run: >-
          node scripts/assert-production-context.mjs
          --source-commit "$GITHUB_SHA"
          --workflow-ref "$GITHUB_REF"
          --origin "$PRODUCTION_ORIGIN"
      - name: Run the complete release gate
        run: npm run ci
      - name: Record exact release evidence before adding hosting controls
        run: npm run release:evidence -- --require-clean --output "$RUNNER_TEMP/release-evidence.json"
      - name: Add Cloudflare controls to the attested build
        run: node scripts/prepare-cloudflare-pages.mjs
      - name: Deploy the exact main commit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npm exec --offline -- wrangler pages deploy dist
          --project-name=wildbloom
          --branch=main
          --commit-hash="$GITHUB_SHA"
          --commit-dirty=false
      - name: Wait for and verify the exact custom-domain release
        env:
          PRODUCTION_ORIGIN: ${{ vars.WILDBLOOM_PRODUCTION_ORIGIN }}
        run: |
          for attempt in $(seq 1 18); do
            if npm run verify:deployment -- \
              --origin "$PRODUCTION_ORIGIN" \
              --evidence "$RUNNER_TEMP/release-evidence.json" \
              --output "$RUNNER_TEMP/deployment-verification.json"; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              exit 1
            fi
            sleep 10
          done
      - name: Retain the release and deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-evidence.json
            ${{ runner.temp }}/deployment-verification.json
          if-no-files-found: error
          retention-days: 90
