name: safari-acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-safari:
    name: installed Safari production journey
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Enable installed Safari automation
        run: sudo safaridriver --enable
      - name: Record installed SafariDriver version
        run: safaridriver --version
      - run: npm run build
      - run: npm run acceptance:safari
